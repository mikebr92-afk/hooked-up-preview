e water off Smoky Cape. Best Jan–March when the East Australian Current pushes warm water inshore."},{name:"Mahi Mahi",season:"November – April",notes:"Summer run following floating debris and weed lines. Often caught alongside Wahoo. Prolific feeders — great sport on light gear."},{name:"Yellowfin Tuna",season:"March – June",notes:"Autumn schools pushing south from QLD. Epic surface action when they're busting bait. Some fish to 80kg+."},{name:"Kingfish",season:"Year round",notes:"Resident on the offshore reefs and pinnacles. Particularly strong March–August. The best sport fish on the Mid North Coast."},{name:"Snapper",season:"May – September",notes:"Winter bottom fishing on the pinnacles and reefs 20–40nm offshore. Quality fish averaging 3–6kg."},{name:"Mulloway",season:"Year round",notes:"Also known as Jewfish. Targeted on the offshore reefs and estuaries. Legal size fish available year-round."},{name:"Spanish Mackerel",season:"October – March",notes:"Spring–summer pelagic. Fast trolling and casting lures in the blue water. Explosive surface strikes."},{name:"Cobia",season:"October – April",notes:"Summer species found around offshore structure, FADs, and weed lines. Underrated sport fish that goes hard."}],species_tags:["Marlin","Mahi Mahi","Dolphin Fish","Dorado","Yellowfin Tuna","Tuna","Kingfish","Kingie","Snapper","Mulloway","Jewfish","Spanish Mackerel","Cobia","Wahoo"],trip_type_tags:["Full Day","Half Day","Multi-Day","Offshore","Game Fishing","Sportfishing","Lure Fishing","Bait Fishing","Private"],experience_tags:["All Levels","Beginner Friendly","Intermediate","Advanced","Corporate"],trips:[{id:"trip-001",name:"Half Day Offshore",duration_hours:5,departure_time:"5:30 AM",max_group:5,what_included:["All rods, reels and tackle","Bait and lures","Light refreshments","Fish cleaning and bagging"],price:750,price_model:"per_group",target_species:["Kingfish","Snapper","Spanish Mackerel"],suitability_notes:"Great introduction to offshore fishing. Covers nearshore has run OceanHunter since 2013.",years_experience:20,photo_url:null,accreditations:["AMSA Coxswain Grade 1","Marine Radio Operator","First Aid Certified","NSW Commercial Fishing Tour Operator"]},{name:"Captain Zane",bio:"Zane grew up fishing the Mid North Coast and has been running charters with OceanHunter for 5 years. Known for his ability to find fish when conditions are tough, Zane specialises in inshore and reef fishing for Kingfish and Snapper. He's particularly good with newer anglers — patient, encouraging, and genuinely stoked when clients catch their first fish.",years_experience:8,photo_url:null,accreditations:["AMSA Coxswain","First Aid Certified"]}],whats_included:["All rods, reels and tackle","Bait and lures","Safety equipment (life jackets, EPIRB, PLBs)","Fish cleaning and bagging","Refreshments (full day: full lunch)","Local knowledge and expert guidance","Catch packed on ice to take home"],what_to_bring:["Sunscreen (SPF 50+, reef-safe preferred)","Polarised sunglasses","Hat or cap","Layers — it's cold before sunrise offshore","Seasickness medication if needed (take night before)","Closed-toe rubber-sole shoes","Valid NSW fishing licence (DPI — free, apply online)","Camera or GoPro","Cash or card for any extras"],cancellation_policy:"Full refund for cancellations made 7+ days before the trip. 50% refund for cancellations 3–6 days prior. No refund within 48 hours, but credit toward a future booking.",weather_policy:"If conditions are unsafe, the captain will contact you the evening before to reschedule at no cost. Your safety is always the priority. A rescheduled trip incurs no fee. We don't fish in winds over 20 knots or swells over 2m.",rating:4.9,review_count:47,reviews:[{reviewer_name:"James W.",location:"Sydney, NSW",date:"2025-03-14",rating:5,trip_type:"Full Day Offshore",text:"Best fishing trip I've ever had. Vic found us a school of yellowfin about 45nm out and we were into fish for 3 straight hours. Double and triple hook-ups. Can't recommend highly enough — worth every cent and then some."},{reviewer_name:"Sarah M.",location:"Brisbane, QLD",date:"2025-02-08",rating:5,trip_type:"Full Day Offshore",text:"Booked this as a surprise for my husband's 40th. Zane was incredible — patient, knowledgeable and genuinely passionate about what he does. They tagged and released a striped marlin and landed two mahi mahi. Husband is still talking about it three months later."},{reviewer_name:"Tom & Dave",location:"Newcastle, NSW",date:"2025-01-22",rating:5,trip_type:"Full Day Offshore",text:"Two marlin in one day. Enough said. Vic put us on fish from first light and never lost the scent. The boat is spotless and all the gear is top quality. Already booked our return trip for the tuna run in April."},{reviewer_name:"Mike P.",location:"Melbourne, VIC",date:"2024-11-30",rating:4,trip_type:"Half Day Offshore",text:"Great half day on the reefs — landed some solid kingfish and a nice snapper. Couldn't do the full day this trip but will definitely be back for one. Zane knew exactly where to go and had us on fish within 20 minutes of leaving the ramp."},{reviewer_name:"Chris & Family",location:"Coffs Harbour, NSW",date:"2024-10-15",rating:5,trip_type:"Half Day Offshore",text:"Took our 10 and 13 year olds out for their first offshore trip. Both kids caught their first kingfish. Zane was incredibly patient with them — kept them engaged the whole time and made the trip fun. Perfect family adventure."},{reviewer_name:"Daniel K.",location:"Sydney, NSW",date:"2024-08-20",rating:5,trip_type:"Full Day Offshore",text:"Absolute professionals. Vic navigated to a pinnacle 40nm out that I've never even heard of — and we smashed snapper and kingfish all day. The fish cleaning and bagging at the end was a nice touch. Went home with 15kg of fillets."}],hero_image:null,gallery:[],captain_photos:[],boat_photos:[],catch_photos:[],phone:"0400 123 456",email:"book@oceanhunter.com.au",website:"https://oceanhunter.com.au",abn:"12 345 678 901",instag
