name: Collect operator images

# Push a request file to image-requests/ on any operator-images/** branch and
# this downloads candidate photos on GitHub's servers (full internet), then
# commits them back to the same branch under images/candidates/<slug>/.
# Nothing here touches the live site; chosen images are wired in separately.

on:
  push:
    branches: ['operator-images/**']
    paths: ['image-requests/**']

permissions:
  contents: write

concurrency:
  group: collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install image tooling
        run: npm install --prefix "$RUNNER_TEMP/deps" --no-save --no-package-lock sharp@0.34

      - name: Collect candidates
        env:
          DEPS_DIR: ${{ runner.temp }}/deps/node_modules
        run: node scripts/collect-images.mjs image-requests

      - name: Commit results to this branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/candidates
          if git diff --cached --quiet; then echo "Nothing new collected."; exit 0; fi
          git commit -m "Collected image candidates (run ${{ github.run_number }})"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
