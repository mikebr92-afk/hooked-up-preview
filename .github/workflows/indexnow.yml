name: IndexNow ping
# After a deploy to main, tell Bing/Yandex (IndexNow) which pages changed.
on:
  push:
    branches: [main]
    paths: ['data/**', 'index.html', 'site-seo.js', 'worker.js']
  workflow_dispatch:
    inputs:
      all:
        description: 'Submit every URL in the sitemap'
        type: boolean
        default: false
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Wait for Cloudflare to deploy this commit
        run: sleep 240
      - name: Submit changed URLs
        run: |
          for i in 1 2 3; do
            node scripts/listings/indexnow.mjs ${{ inputs.all && '--all' || '' }} && exit 0
            sleep 120
          done
          exit 1
